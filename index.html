<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flutter CRUD คืนเดียว</title>
<meta name="description" content="ติว Flutter + SQLite + Provider จากศูนย์ เขียนแอป CRUD ให้ entity ไหนก็ได้ สำหรับ quiz 273387">
<meta name="theme-color" content="#c8460d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
/* radius rule: buttons + chips = pill, cards 18px, code + panels 12px, inputs 10px */
:root{
  --bg:#f8f8f7; --surface:#fff; --surface-2:#f2f1ef; --surface-3:#e8e6e3;
  --ink:#1a1817; --ink-2:#45403c; --muted:#706a65; --line:#e5e1dd;
  --accent:#c8460d; --accent-strong:#a33808; --accent-ink:#fff; --accent-soft:#fff0e6; --accent-line:#f6c9ad;
  --bad:#c0392b; --bad-soft:#fbeae7; --warn-soft:#fff4dc;
  --kw:#a3266b; --str:#2d7a4b; --ty:#1d5ea8; --cm:#857e78; --num:#2d7a4b;
  --shadow:0 1px 2px rgb(60 30 10 / .06), 0 8px 24px rgb(60 30 10 / .06);
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121010; --surface:#1b1817; --surface-2:#231f1d; --surface-3:#2d2826;
  --ink:#efeae6; --ink-2:#cbc3bd; --muted:#9a918a; --line:#332d2a;
  --accent:#ff8a4c; --accent-strong:#ffa673; --accent-ink:#2a0e00; --accent-soft:#3a1f12; --accent-line:#6b3417;
  --bad:#ff8a7a; --bad-soft:#3a1d1a; --warn-soft:#3a2f14;
  --kw:#f18bbd; --str:#8fd19e; --ty:#83b5f2; --cm:#8a827c; --num:#8fd19e;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
}}
:root[data-theme="dark"]{
  --bg:#121010; --surface:#1b1817; --surface-2:#231f1d; --surface-3:#2d2826;
  --ink:#efeae6; --ink-2:#cbc3bd; --muted:#9a918a; --line:#332d2a;
  --accent:#ff8a4c; --accent-strong:#ffa673; --accent-ink:#2a0e00; --accent-soft:#3a1f12; --accent-line:#6b3417;
  --bad:#ff8a7a; --bad-soft:#3a1d1a; --warn-soft:#3a2f14;
  --kw:#f18bbd; --str:#8fd19e; --ty:#83b5f2; --cm:#8a827c; --num:#8fd19e;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:128px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.75 Prompt,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
code,pre,.mono,.blank,.timer{font-family:var(--mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
p code,li code,td code,.note code,h3 code{font-size:.86em;background:var(--surface-2);padding:.1em .38em;border-radius:6px;white-space:nowrap}
a{color:var(--accent-strong)}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.read{max-width:720px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.brand i{color:var(--accent);font-size:22px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;margin-left:auto}
.seg button{border:0;background:none;padding:7px 18px;border-radius:999px;font-weight:500;font-size:15px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:999px;display:grid;place-items:center;font-size:20px;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink)}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:56px}
.hero h1{font-size:clamp(32px,4.4vw,50px);line-height:1.18;letter-spacing:-.02em;margin:0 0 16px;font-weight:700;text-wrap:balance}
.hero p{font-size:18px;margin:0 0 28px;opacity:.92;max-width:34em}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 24px;font-weight:600;font-size:16px;text-decoration:none;transition:transform .15s ease,background-color .15s ease}
.btn:active{transform:scale(.97)}
.btn-light{background:var(--accent-ink);color:var(--accent)}
.btn-ghost{background:transparent;color:var(--accent-ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent-ink) 55%,transparent)}
.btn-acc{background:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--surface-2);color:var(--ink)}
.btn-soft:hover{background:var(--surface-3)}
.hero svg{width:100%;height:auto;display:block}
.hero svg text{font-family:Prompt,sans-serif}

/* sections and cards */
main{padding-bottom:80px}
.lesson{margin-top:28px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:36px 40px}
.card + .card{margin-top:22px}
.card h2{font-size:clamp(24px,2.6vw,31px);line-height:1.3;letter-spacing:-.015em;margin:0 0 10px;font-weight:700;text-wrap:balance}
.card h3{font-size:19px;margin:28px 0 6px;font-weight:600}
.lede{color:var(--muted);font-size:17px;margin:0 0 22px;max-width:44em}
.panel{background:var(--accent-soft);border-radius:12px;padding:22px}
.next{display:flex;width:100%;justify-content:space-between;align-items:center;margin-top:28px;border:0;border-radius:14px;background:var(--surface-2);padding:16px 20px;font-weight:600;font-size:16px;text-align:left}
.next:hover{background:var(--surface-3)}
.next span{color:var(--muted);font-weight:400;font-size:14px;display:block}
.next i{font-size:22px;color:var(--accent)}

/* entity bar */
.entbar{position:sticky;top:62px;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.entbar .wrap{display:flex;gap:10px;align-items:center;min-height:58px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.entbar label{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:14.5px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.mode{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.mode button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* code */
.code{margin:0;background:var(--surface-2);border-radius:12px;padding:16px 18px;overflow-x:auto;font-size:13.6px;line-height:1.62;tab-size:2}
.code code{font-family:var(--mono);white-space:pre}
.k{color:var(--kw);font-weight:600}.s{color:var(--str)}.t{color:var(--ty)}.c{color:var(--cm);font-style:italic}.n{color:var(--num)}
.e{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:3px;box-shadow:0 1.5px 0 var(--accent)}
.file{margin-top:22px}
.filehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.path{font-family:var(--mono);font-size:14px;background:var(--surface-2);padding:5px 12px;border-radius:999px}
.tag{font-size:13px;color:var(--accent-strong);background:var(--accent-soft);padding:3px 11px;border-radius:999px;white-space:nowrap}
.copy{margin-left:auto;border:0;background:none;color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px}
.copy:hover{background:var(--surface-2);color:var(--ink)}
.part{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start;padding:14px 0}
.part + .part{border-top:1px solid var(--line)}
.note p{margin:0 0 10px;font-size:15.5px;color:var(--ink-2)}
.note p:last-child{margin-bottom:0}
.note b{color:var(--ink)}


/* reading path */
.route{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.route li{display:grid;grid-template-columns:1fr 52px;gap:8px;align-items:stretch}
.pgo{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;text-align:left;border:0;background:var(--surface-2);border-radius:14px;padding:12px 16px;transition:background-color .15s ease,transform .15s ease}
.pgo:hover{background:var(--surface-3)}
.pgo:active{transform:scale(.99)}
.pn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--accent-strong)}
.pt{display:grid;min-width:0}
.pt b{font-weight:600;font-size:16px;line-height:1.45}
.pt span{font-size:14px;color:var(--muted);line-height:1.5}
.pm{font-size:13.5px;color:var(--muted);white-space:nowrap}
.pck{display:grid;place-items:center;background:var(--surface-2);border-radius:14px;cursor:pointer;position:relative}
.pck input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.pck i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line);color:transparent;font-size:17px;transition:background-color .15s ease}
.route li.done .pck i{background:var(--accent);box-shadow:none;color:var(--accent-ink)}
.route li.done .pn{background:var(--accent);color:var(--accent-ink)}
.route li.done .pt b{color:var(--muted)}
.pck input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px;color:var(--ink-2)}

/* map diagram */
.mwrap{max-width:680px;margin:0 auto}
.mbox{display:grid;gap:1px;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:12px 16px;box-shadow:inset 0 0 0 1.5px var(--accent-line);width:100%;transition:box-shadow .15s ease,transform .15s ease}
.mbox:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.mbox:active{transform:scale(.985)}
.mbox b{font-size:15.5px;word-break:break-word}
.mbox span{font-size:14px;color:var(--ink-2);line-height:1.5}
.mbox em{font-style:normal;font-size:12.5px;color:var(--accent-strong);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 112px 1fr;gap:8px;align-items:center;margin-top:16px}
.side{font-size:13px;text-align:center;color:var(--ink-2);line-height:1.4}
.side i{display:block;font-size:22px;color:var(--accent);margin-bottom:2px}
.side small{color:var(--accent-strong);font-weight:600}
.lane{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 4px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.lane div{display:flex;gap:6px;align-items:flex-start;min-width:0}
.lane code{white-space:normal!important;word-break:break-word}
.lane i{color:var(--accent);font-size:18px;flex:none;margin-top:1px}

/* flow lab */
.lab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.lab-side{display:grid;gap:14px;min-width:0}
.box2{background:var(--surface);border-radius:12px;padding:14px 16px;transition:box-shadow .2s ease;min-width:0}
.box2 h4{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.box2 h4 i{font-size:18px;color:var(--accent)}
.box2.lit{box-shadow:0 0 0 2.5px var(--accent)}
.mem{font-family:var(--mono);font-size:12.8px;line-height:1.6;white-space:pre;overflow-x:auto;min-height:24px}
.mem .flash,.dbt tr.flash td{animation:flash 1.1s ease}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 35%,transparent)}100%{background:transparent}}
.dbt{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;width:100%}
.dbwrap{overflow-x:auto}
.dbt th,.dbt td{padding:5px 8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.dbt th{color:var(--muted);font-weight:600}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:5px 0;color:var(--muted);transition:color .2s}
.log li.on{color:var(--ink)}
.log li .d{width:10px;height:10px;border-radius:50%;margin-top:8px;background:var(--line)}
.log li.on .d{background:var(--accent)}
.log li code{font-size:12.6px;white-space:normal;word-break:break-word}
.labbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* phone */
.phone{background:#101413;border-radius:36px;padding:10px;box-shadow:var(--shadow);max-width:300px;margin:0 auto;width:100%}
.screen{background:#fafcfb;color:#1b1f1e;border-radius:28px;overflow:hidden;height:540px;display:flex;flex-direction:column;position:relative;font-size:14px;line-height:1.45}
.appbar{background:#fde8dc;padding:30px 16px 14px;font-weight:600;font-size:17px;display:flex;align-items:center;gap:10px}
.appbar button{border:0;background:none;font-size:20px;padding:0;display:grid;color:#1b1f1e}
.lst{flex:1;overflow-y:auto}
.tile{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #e7ecea;cursor:pointer}
.tile:active{background:#eef3f1}
.tile .tt{flex:1;min-width:0}
.tile .t1{font-weight:500;font-size:15px}
.tile .t2{font-size:12.5px;color:#5c6663;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile button{border:0;background:none;font-size:20px;color:#5c6663;padding:6px;border-radius:50%;display:grid}
.empty{flex:1;display:grid;place-items:center;color:#5c6663}
.fab{position:absolute;right:16px;bottom:18px;width:54px;height:54px;border-radius:16px;border:0;background:#fdd5bf;color:#7a2a06;font-size:26px;display:grid;place-items:center;box-shadow:0 4px 10px rgb(0 0 0 / .18)}
.frm{flex:1;overflow-y:auto;padding:12px 16px 16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:#c8460d}
.fld input[type=text],.fld input[type=date]{width:100%;border:0;border-bottom:1.5px solid #9aa5a1;background:transparent;padding:6px 0;font-size:16px;color:#1b1f1e;border-radius:0}
.fld input:focus{outline:0;border-bottom-color:#c8460d}
.fld.err input{border-bottom-color:#c0392b}
.fld .msg{color:#c0392b;font-size:12px;min-height:0}
.sw{display:flex;align-items:center;justify-content:space-between;padding:6px 0 12px;font-size:15px}
.sw input{width:44px;height:24px;accent-color:#c8460d}
.save{width:100%;border:0;border-radius:999px;background:#c8460d;color:#fff;padding:11px;font-weight:600;margin-top:6px}
.busy::after{content:"";position:absolute;inset:0;background:transparent}

/* primer */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini{background:var(--surface-2);border-radius:12px;padding:18px 20px;min-width:0}
.mini h3{margin:0 0 4px;font-size:17px}
.mini p{margin:0 0 12px;font-size:15px;color:var(--ink-2)}
.mini .code{background:var(--surface);font-size:13px;padding:12px 14px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13.5px;padding:8px 10px}
.tbl td{padding:12px 10px;vertical-align:top;border-top:1px solid var(--line)}
.tblwrap{overflow-x:auto}
.errs{display:grid;gap:12px}
.err{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;background:var(--surface-2);border-radius:12px;padding:16px 18px}
.err .msg{font-family:var(--mono);font-size:13.5px;color:var(--bad);word-break:break-word}
.err p{margin:0;font-size:15px;color:var(--ink-2)}
.err p + p{margin-top:6px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:86px 1fr;gap:18px;padding:0 0 22px;position:relative}
.tl li::before{content:"";position:absolute;left:108px;top:10px;bottom:-4px;width:2px;background:var(--accent-line)}
.tl li:last-child::before{display:none}
.tl .min{font-family:var(--mono);font-size:14px;color:var(--accent-strong);font-weight:600;text-align:right;padding-top:2px}
.tl .what{padding-left:22px;position:relative}
.tl .what::before{content:"";position:absolute;left:-1px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--surface)}
.tl b{display:block;font-size:16.5px}
.tl span{color:var(--ink-2);font-size:15px}
ol.steps{margin:0;padding-left:22px}
ol.steps li{margin-bottom:10px;padding-left:4px}

/* practice */
.subtabs{display:flex;gap:8px;margin:28px 0 0;flex-wrap:wrap}
.subtabs button{border:0;border-radius:999px;padding:9px 18px;background:var(--surface);box-shadow:var(--shadow);font-weight:500}
.subtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.blank{font-family:var(--mono);font-size:13.4px;border:0;border-bottom:2px solid var(--accent);background:var(--surface);border-radius:4px 4px 0 0;padding:0 4px;min-width:3ch;color:var(--ink)}
.blank:focus{outline:2px solid var(--accent);outline-offset:1px}
.blank.ok{border-color:var(--accent);background:var(--accent-soft)}
.blank.no{border-color:var(--bad);background:var(--bad-soft)}
.fillbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.score{font-weight:600;margin-left:auto}
.q{max-width:720px}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px}
.qbar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:22px}
.qbar div{height:100%;background:var(--accent);transition:width .3s ease}
.qtext{font-size:20px;font-weight:600;line-height:1.5;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;border:0;background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:16px;min-height:60px;transition:background-color .15s}
.opt:hover{background:var(--surface-3)}
.opt .L{width:36px;height:36px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-weight:700}
.opt.right{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.right .L{background:var(--accent);color:var(--accent-ink)}
.opt.wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt code{white-space:normal}
.fb{margin-top:16px;border-radius:14px;padding:16px 18px;animation:up .25s ease}
.fb.good{background:var(--accent-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{display:block;font-size:17px;margin-bottom:4px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.spec{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:16px 0}
.spec div{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.spec .fn{font-family:var(--mono);font-weight:600}
.spec .ft{font-family:var(--mono);font-size:13px;color:var(--ty)}
.spec .fl{font-size:14px;color:var(--muted)}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.checks label{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:12px 14px;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent);flex:none}
.timer{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:.02em}

/* custom entity dialog */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100% - 24px));box-shadow:0 20px 60px rgb(0 0 0 / .3)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.dlg{padding:26px}
.dlg h3{margin:0 0 4px;font-size:21px}
.dlg .lede{font-size:15px;margin-bottom:16px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:16px}
.inp:focus{outline:0;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 112px 1fr 36px;gap:8px;margin-bottom:8px;align-items:center}
.frow select{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px;font-size:15px}
.errlist{color:var(--bad);font-size:14px;margin:10px 0 0;padding-left:18px}
.dlgbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;animation:up .2s ease}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr;gap:26px;padding-top:40px;padding-bottom:40px}
  .part{grid-template-columns:1fr;gap:12px}
  .lab{grid-template-columns:1fr}
  .err{grid-template-columns:1fr;gap:8px}
}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 16px}
  .card{padding:24px 18px;border-radius:16px}
  .brand span{display:none}
  .seg button{padding:7px 13px;font-size:14.5px}
  .grid2{grid-template-columns:1fr}
  .code{font-size:12.6px;padding:14px}
  .tl li{grid-template-columns:58px 1fr;gap:12px}
  .tl li::before{left:74px}
  .lane{grid-template-columns:1fr;gap:6px}
  .frow{grid-template-columns:1fr 96px 36px}
  .frow .lbl{grid-column:1 / 3}
  .qtext{font-size:18px}
  .entbar label{display:none}
  .pgo{grid-template-columns:32px 1fr;gap:10px;padding:12px}
  .pn{width:30px;height:30px;font-size:14px}
  .pm{grid-column:2}
  .route li{grid-template-columns:1fr 46px}
  .entbar .wrap{gap:8px}
  .chips{flex:1 1 100%}
  .mode{width:100%}
  .mode button{flex:1}
  .row2{grid-template-columns:1fr}
  .side{display:flex;gap:6px;justify-content:center;align-items:center}
  .side i{display:inline;margin:0}
  .side br{display:none}
  html{scroll-padding-top:170px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#learn"><i class="ph ph-database"></i><span>Flutter CRUD คืนเดียว</span></a>
  <nav class="seg" role="tablist">
    <button role="tab" data-tab="learn">เรียน</button>
    <button role="tab" data-tab="practice">ฝึก</button>
    <button role="tab" data-tab="exam">วันสอบ</button>
  </nav>
  <button class="icon-btn" id="theme" aria-label="สลับธีม"><i class="ph ph-moon"></i></button>
</div></header>

<div id="view-learn" hidden></div>
<div id="view-practice" hidden></div>
<div id="view-exam" hidden></div>

<dialog id="dlg"></dialog>
<script src="gen.js"></script>
<script src="app.js"></script>
</body>
</html>
